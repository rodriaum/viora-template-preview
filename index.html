<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%icon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Explore the Viora UI component library."
    />
    <title>Viora UI Components</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const redirect = sessionStorage.getItem("viora-spa-redirect")
        if (redirect) {
          sessionStorage.removeItem("viora-spa-redirect")
          window.history.replaceState(null, "", redirect)
        }
      } catch {
        // Ignore unavailable session storage.
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
