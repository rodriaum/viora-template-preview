<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting · Viora UI</title>
    <script>
      const route = window.location.pathname + window.location.search + window.location.hash
      try {
        window.sessionStorage.setItem("viora-spa-redirect", route)
      } catch {
        // The app will still load at its home route if storage is unavailable.
      }
      window.location.replace("/template-preview/")
    </script>
  </head>
  <body>
    <p>Redirecting to Viora UI...</p>
  </body>
</html>
